packages:
  - .

allowBuilds:
  # Next.js uses a prebuilt resolver package here; its optional install script
  # is not required for Snack Meet and is deliberately not executed.
  unrs-resolver: false

overrides:
  prosemirror-model: 1.25.3
  prosemirror-state: 1.4.3
  prosemirror-view: 1.41.3
  prosemirror-transform: 1.10.4
  prosemirror-tables: 1.8.1
